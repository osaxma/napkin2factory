decisions:
- id: DEC-001
  date: 2026-11-04
  title: 'Design direction: Twin-column portal'
  context: 'Chosen among 3 concept direction(s) compared on the concept board. Other ideas considered:
    C-001 "Single-column C-frame" (red: the arm''s tip deflects 1.82 mm (computed), beyond the 0.2 mm
    limit on the card (limit ÷ sag is 0.11, 1.25 needed, cyclic case) — FL_a^3 / (3*E*I_a) + FL_a^2*H
    / (E*I_c) for an arm reaching 180 mm from the column''s centre line, 850 mm above its foot; Roark''s
    Formulas for Stress and Strain, 7th ed., Table 8.1, Cases 1a & 3a (Track A §3.1); aluminum-6063-t5
    in calckit/data/materials.yaml [verify]) — set aside: The frame sags 1.82 mm at the load axis against
    the 0.20 mm limit: a single column turns under the moment of the load (the screen counts the column
    and the upper arm; SPEC 4.4 adds the base arm and the column''s stretch for 1.90 mm). Mass and cost
    pass.; C-003 "Plate gantry" (red: even the low end of the cost, 3462 USD, is over the 2400 USD budget;
    even the low end of the cost, 3476 USD, is over the 2400 USD budget; total mass 110 kg (estimate),
    over the 25 kg limit on the card) — set aside: Mass and cost: 110 kg against the 25 kg limit, and
    even the low end of the cost, 3476 USD, is over the 2400 USD budget. The plate gantry is the stiffest
    frame (SPEC 4.5: 0.0162 mm) but the steel is not affordable or liftable..'
  decision: Take C-002 (Twin-column portal) forward as the design direction. Its site constraints are
    already requirements here (the footprint, the mass and the cost limits), so promotion seeded nothing
    new; style.yaml takes its look.
  rationale: 'Screening of C-002 (green): width 380 mm (computed); depth 350 mm (computed); height 992
    mm (computed); mass 9.86 kg (computed); total mass 16.5 kg (estimate); cost low 434 USD (estimate);
    cost high 1598 USD (estimate); lift class one-person (estimate).'
