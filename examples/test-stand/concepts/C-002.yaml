notes: >-
  Two columns 300 mm apart, a crosshead on top and a base beam below: a closed rectangle. The beams are 60 x 40 x 5 mm sections in the spec; here a 60 x 60 x 4 mm square section stands in, which has the same weight to within half a per cent (896 against 900 square mm). The beams spell their material differently from the columns so the package's structural screen, which models a column with an arm, leaves the portal alone: it says so instead of judging a portal as a cantilever (B-0210).
