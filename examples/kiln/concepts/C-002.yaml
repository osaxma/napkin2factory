# Concept card C-002: one possible direction for the product.
# Concepts sit outside the build: nothing here changes `n2f build`; edit freely.
# Read it back with `n2f concept show C-002`; check it with `n2f concept lint`.
# Retrofit (v0.2, M6): the direction worked back from the 800 mm alcove.
id: C-002
title: 'Compact: fits the 800 mm alcove'
# status: exploring | rejected | promoted (reject and promote set it for you)
status: rejected
based_on: C-001  # the card this one started from
refs: []
# nothing beside the body: the controller box moves under it, inside the stand
layout: {load: front, door: hinged-left, controls: below, stand: four-leg}
# brick as built (brick-thickness, brick-conductivity); fiber cut from 125 mm to 50 mm; no guard
envelope:
  chamber: [150 mm, 150 mm, 150 mm]
  insulation:
    - {name: brick, thickness: 64 mm, conductivity: 0.25 W/(m*K)}
    - {name: fiber, thickness: 50 mm, conductivity: 0.15 W/(m*K)}
    - {name: shell, thickness: 1.2 mm}
  max_temperature: 1200 degC
  power: 2500 W
  # the 8 L chamber the owner asked for (REQ-001), which this direction gives up
  target_volume: 8 L
# touch-limit: 60 degC on any surface a user can touch (REQ-003)
site: {width: 800 mm, circuit: 230V-16A, touch_limit: 60 degC}
style: {preset: industrial}
# modules (v0.4): the units the kiln is built from and why. The door is built as one unit
# (assembly.md section 5); the controls are fitted and wired by an electrician, another trade
# (installation.md). Shell, lining, guard and the one-piece welded stand are fitted in
# sequence in the final assembly, so they belong to no module: start flat, split for a reason.
modules: {door: {driver: [built-as-unit]}, controls: {driver: [separate-process-or-supplier]}}
# body = chamber + 2 × (64 + 50 + 1.2) mm = 380.4 mm a side; a flush 30 mm door; the as-built
# hinge, controller box (260 × 120 × 160 mm) and 25 mm tube stand
massing:
  - {kit: block, as: body, args: {length: 380.4 mm, width: 380.4 mm, height: 380.4 mm}, at: {y: 190.2 mm, z: 700 mm}}
  - {kit: block, as: door, module: door, args: {length: 380.4 mm, width: 30 mm, height: 380.4 mm}, at: {y: -15 mm, z: 700 mm}}
  - {kit: block, as: hinge, role: trim, material: mild steel, process_class: machining, args: {length: 12 mm, width: 12 mm, height: 300 mm}, at: {x: -196.2 mm, y: -15 mm, z: 740.2 mm}}
  - {kit: block, as: controls, module: controls, material: abs, process_class: cots-controls, args: {length: 260 mm, width: 120 mm, height: 160 mm}, at: {y: 190.2 mm, z: 500 mm}}
  - {kit: frame, as: stand, material: mild steel, args: {length: 380.4 mm, width: 380.4 mm, height: 700 mm, member: {profile: square-tube, size: 25 mm, wall: 1.5 mm}, top_rails: true, bottom_rails: true, bottom_rail_height: 150 mm}, at: {y: 190.2 mm}}
notes: >-
  Worked back from screening's alcove rule: the closed width plus the door leaf swung fully back
  must stay within 800 mm, so the body can be at most about 390 mm wide. With the as-built 190 mm
  walls that leaves no room for a chamber at all, so this direction trades three things, each
  visible in its numbers: (1) a 150 mm chamber, 3.4 L gross, against the 8 L REQ-001 asks for;
  (2) 50 mm of fiber instead of 125 mm and no touch guard, so the skin estimate is 91 degC (under
  "more numbers") against the 60 degC touch limit (REQ-003) — adding the 25 mm ventilated guard
  and a door to match takes it to about 970 mm with the door open, past the alcove again; (3)
  the controller box moves under the body, inside the stand. The same 2.5 kW element on the same
  230 V / 16 A circuit then heats the small chamber in 1.4 h (estimate). The card states the 8 L
  target and the 60 degC touch limit, so screening lists (1) and (2) as worth a look: the
  trade-offs show on the board without a red verdict. The new door's opening angle is not
  decided, so screening counts it swung fully back, the widest case.
# written for you: screening by `n2f concept build`, decision by reject or promote
screening:
  given:
    power: {value: 2.5 kW, label: given, source: on the card, ref: envelope.power}
    circuit_class: {value: the 230V-16A circuit, label: given, source: on the card, ref: site.circuit}
  computed:
    width: {value: 392 mm, label: computed, source: measured across the rough shapes, ref: massing bounding box (x)}
    depth: {value: 410 mm, label: computed, source: measured across the rough shapes, ref: massing bounding box (y)}
    height: {value: 1080 mm, label: computed, source: measured across the rough shapes, ref: massing bounding box (z)}
    volume: {value: 67.8 L, label: computed, source: the space the rough shapes fill, ref: sum of the massing silhouettes}
    footprint_with_door_swing: {value: 773 mm, label: computed, source: the body plus the door leaf swung fully back beside the hinge, ref: width + open door (the 380 mm door leaf swung fully back; the card does not say how far it opens)}
    door_leaf: {value: 380.4 mm, label: computed, source: the width of the door that swings open, ref: 'massing call `door`, x-extent'}
  estimates:
    insulation_mass: {value: 17.1 kg, label: estimate, source: from the wall layers' sizes and their materials; to be checked, ref: layer volumes × density (K-23 insulating firebrick; ceramic fiber board (Kaowool 1260); sheet shell)}
    heat_loss: {value: 715 W, label: estimate, source: from the wall layers at the hot-face temperature in a 25 °C room; to be checked, ref: 'thermal_enclosure.steady_loss (kiln parameters: room 25 degC, h 5 W/m²K, ε 0.9 [verify])'}
    skin_temperature: {value: 91 degC, label: estimate, source: from the heat loss through the outer face; to be checked, ref: 'thermal_enclosure.steady_loss (kiln parameters: room 25 degC, h 5 W/m²K, ε 0.9 [verify])'}
    stored_heat: {value: 9.3 MJ, label: estimate, source: 'the heat the walls hold at temperature, from their materials', ref: thermal_enclosure.stored_heat}
    heat_up_time: {value: 1.4 h, label: estimate, source: from the walls' stored heat and the element power, ref: thermal_enclosure.heat_up_time}
    current: {value: 10.9 A, label: estimate, source: from the power and the circuit's voltage, ref: power.element_current at 230 V}
    cost_low: {value: 344 USD, label: estimate, source: 'rough cost of the hinge, controls, stand, brick layer and fiber layer from cost bands per process; the body and the door are not counted; to be checked', ref: 'mass_cost.cost_estimate (hinge: machining; controls: cots-controls; stand: welding; brick layer: cut-block; fiber layer: fiber-board) [verify]'}
    cost_high: {value: 697 USD, label: estimate, source: 'rough cost of the hinge, controls, stand, brick layer and fiber layer from cost bands per process; the body and the door are not counted; to be checked', ref: 'mass_cost.cost_estimate (hinge: machining; controls: cots-controls; stand: welding; brick layer: cut-block; fiber layer: fiber-board) [verify]'}
  rules:
    - {id: fits-site-width, title: Fits the alcove with the door open, severity: fail, status: pass, message: 773 mm with the door open (392 mm + 380 mm) fits the 800 mm alcove, relies_on: [computed]}
    - {id: fits-site-depth, title: Fits the alcove depth, severity: fail, status: skip, message: no alcove depth on the card, relies_on: []}
    - {id: fits-site-height, title: Fits the alcove height, severity: fail, status: skip, message: no alcove height on the card, relies_on: []}
    - {id: circuit-available, title: The supply on site carries it, severity: fail, status: pass, message: '2.5 kW draws 10.9 A at 230 V: fits the 230V-16A circuit on site', relies_on: [estimate, given]}
    - {id: mass-vs-lift-class, title: How it can be lifted and moved, severity: warn, status: skip, message: 'no mass: give each rough shape a material', relies_on: []}
    - {id: blank-vs-stock-sheet, title: Every sheet fits a stock size, severity: fail, status: skip, message: no folded sheet-metal shapes on the card, relies_on: []}
    - {id: walls-fit-envelope, title: The walls fit inside the body, severity: fail, status: pass, message: chamber plus 2 × 115 mm of insulation (380 × 380 × 380 mm) fits inside body (380 × 380 × 380 mm), relies_on: [computed]}
    - {id: controls-not-adjacent-hot-face, title: Controls away from the hot air path, severity: warn, status: pass, message: controls (below) are away from the door (hinged-left), relies_on: []}
    - {id: skin-vs-touch-limit, title: The outside is safe to touch, severity: warn, status: warn, message: 'the outside skin is about 91 degC (estimate), above the 60 degC touch limit (on the card) — more insulation or a guard would bring it down', relies_on: [estimate, given]}
    - {id: chamber-volume-vs-target, title: The chamber holds the target volume, severity: warn, status: warn, message: 'the 150 × 150 × 150 mm chamber holds 3.38 L, less than the 8 L the card aims for', relies_on: [given]}
  verdict: green
  at: '2026-11-01T08:07:12'
  notes:
    - 'the body and the door have no material yet, so the rough shapes have no mass: give them a material to weigh them'
    - the card does not say how far the door opens, so the open door is counted swung fully back against the wall (the widest case); give its opening angle (like 110 degree) to count only what it really needs
    - 'the cost leaves out the body and the door: no material, so no mass to price'
decision: {reason: 'set aside when C-003 was chosen (DEC-018)', at: '2026-10-31T19:26:39'}
