id: stand
rev: A
name: Welded stand
kind: custom
role: stand
process: welding
material: {name: mild steel, spec: "25 x 25 x 1.5 square tube, S235"}
finish: powder coat, black
tolerance_class: ISO2768-c
geometry:
  kit: frame
  args:
    length: param://stand-width
    width: param://stand-depth
    height: param://stand-height
    member: {profile: square-tube, size: param://stand-tube, wall: param://stand-tube-wall}
    top_rails: true
    bottom_rails: true
    bottom_rail_height: 150 mm
interfaces: [iface://shell-frame-mount]
satisfies: [req://REQ-011]
cost: {unit: 140 USD, basis: estimate, note: "cut, weld, powder coat"}
lead_time: 15 d
manufacturer_notes: Four Ø6.6 holes in the top rails take M6 rivet nuts (the rails are hollow); set the rivet nuts before coating. Cut list on the drawing.
