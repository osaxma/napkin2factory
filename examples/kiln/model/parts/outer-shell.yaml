id: outer-shell
rev: A
name: Inner sheet-metal shell
kind: custom
process: sheet-metal
material: {name: mild steel, spec: "1.2 mm CR4 (DC01)"}
finish: high-temperature powder coat, black (silicone-polyester, 200 degC class)
tolerance_class: ISO2768-m
geometry:
  kit: enclosure
  args:
    # Built as a tray open on +Z; the assembly rotates it so the opening faces the front (−Y).
    length: param://shell-outer-width
    width: param://shell-outer-height
    height: param://shell-outer-depth
    thickness: param://shell-thickness
    bend_radius: param://shell-bend-radius
    flange: param://shell-flange
    cutouts:
      # the tray's base is the kiln's back wall: element tails low, thermocouples at chamber mid-height
      - {face: base, center: [param://tail-neg-hole-x, param://tail-hole-z-shell], width: param://tail-hole-shell, height: param://tail-hole-shell, corner_radius: 9.9 mm, label: tail-left}
      - {face: base, center: [param://tail-hole-x, param://tail-hole-z-shell], width: param://tail-hole-shell, height: param://tail-hole-shell, corner_radius: 9.9 mm, label: tail-right}
      - {face: base, center: [param://thermocouple-neg-offset-x, param://thermocouple-z-shell], width: param://thermocouple-hole-shell, height: param://thermocouple-hole-shell, corner_radius: 6.9 mm, label: thermocouple-control}
      - {face: base, center: [param://thermocouple-offset-x, param://thermocouple-z-shell], width: param://thermocouple-hole-shell, height: param://thermocouple-hole-shell, corner_radius: 6.9 mm, label: thermocouple-limit}
interfaces: [iface://guard-standoff-left, iface://guard-standoff-right, iface://guard-standoff-top, iface://guard-standoff-bottom]
satisfies: [req://REQ-002, req://REQ-004, req://REQ-005]
cost: {unit: 320 USD, basis: estimate, note: "multi-piece weldment (wrap + two end panels), deburred, high-temp powder coat, quantity 1"}
lead_time: 15 d
manufacturer_notes: May be built as a wrap plus two end panels (or four panels on corner angles) joined by spot welds or rivets with closed corners; the one-piece flat pattern is a reference development only. Critical dimensions are the inside width and height (fiber fit). Sixteen Ø6.6 standoff holes (four per side wall) and the rear tail and thermocouple holes are in the DXF. High-temperature powder coat outside only; inside bare. Deburr all edges.
