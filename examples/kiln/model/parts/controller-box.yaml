id: controller-box
rev: A
name: Controller enclosure
kind: custom
role: controls
process: sheet-metal
material: {name: mild steel, spec: "1.0 mm CR4 (DC01)"}
finish: powder coat, black
tolerance_class: ISO2768-m
geometry:
  kit: enclosure
  args:
    length: param://controller-box-width
    width: param://controller-box-depth
    height: param://controller-box-height
    thickness: param://controller-sheet
    bend_radius: 1 mm
    flange: 10 mm
    cutouts:
      - {face: front, center: [-70, 20], width: param://controller-cutout, height: param://controller-cutout, corner_radius: 1 mm, label: pid-cutout}
      - {face: front, center: [-10, 20], width: param://controller-cutout, height: param://controller-cutout, corner_radius: 1 mm, label: limit-cutout}
interfaces: [iface://controller-mount, iface://controller-lid-seat, iface://entry-mains, iface://entry-element, iface://entry-sensing]
satisfies: [req://REQ-007, req://REQ-008]
cost: {unit: 80 USD, basis: estimate}
lead_time: 15 d
manufacturer_notes: Instrument cutouts 45 +0.6/0 mm (48 × 48 DIN). Three Ø20.5 gland holes in the base. Closed corners. Mounts on four 40 mm standoffs against the guard's right wall (holes in the DXF).
