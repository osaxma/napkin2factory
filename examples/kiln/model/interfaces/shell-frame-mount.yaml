id: shell-frame-mount
kind: bolt-pattern
parties: [part://guard-shell, part://stand]
description: Four M6 × 50 bolts, one per corner, from inside the inner shell through the bottom standoffs and the guard's bottom wall into rivet nuts in the stand's top rails (DEC-021); the holes are shared with guard-standoff-bottom, which lists the standoffs.
frame: {origin: [0, 0, 0], normal: [0, 0, 1]}
frames:
  # guard tray coordinates: the kiln's bottom wall is the tray's −Y wall at y = −height/2; the
  # tray's z axis is the kiln's depth, so the pattern is centred at z = depth/2.
  part://guard-shell:
    origin: [0, {expr: "-guard-outer-height / 2", unit: mm}, {expr: "guard-outer-depth / 2", unit: mm}]
    normal: [0, 1, 0]
    x_axis: [1, 0, 0]
  part://stand:
    origin: [0, 0, param://stand-height]
    normal: [0, 0, 1]
    x_axis: [1, 0, 0]
# P2: the guard's bottom face sits on the stand's top rails, so the frames coincide
offset: 0 mm
spec: {pattern: rect, count: 4, diameter: param://mount-bolt-clearance, spacing: [param://mount-bolt-spacing-x, param://mount-bolt-spacing-y], hardware: [{part: part://m6x50-bolt, per_hole: 1}, {part: part://m6-rivnut, per_hole: 1}], depth: 20 mm}
