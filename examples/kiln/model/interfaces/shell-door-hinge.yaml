id: shell-door-hinge
kind: bolt-pattern
parties: [part://guard-shell, part://door-skin]
description: Two M6 bolts per hinge leaf, two hinges, through the guard's front lip (−X side) and the door skin.
frame: {origin: [0, 0, 0], normal: [0, 0, 1]}
frames:
  # guard tray coordinates: the lip lies in the plane z = depth at the tray's opening; the hinge
  # column runs along the tray's y (the kiln's vertical) in the middle of the −X lip.
  part://guard-shell: {origin: [param://guard-lip-x, 0, param://guard-outer-depth], normal: [0, 0, 1], x_axis: [0, 1, 0]}
  # door skin coordinates: panel centred at the origin, thickness along +Z, same x as the lip column.
  part://door-skin: {origin: [param://guard-lip-x, 0, 0], normal: [0, 0, 1], x_axis: [0, 1, 0]}
spec: {pattern: line, count: 4, diameter: param://hinge-bolt-clearance, spacing: [param://hinge-bolt-spacing], fastener: part://m6x16-bolt, depth: 10 mm}
