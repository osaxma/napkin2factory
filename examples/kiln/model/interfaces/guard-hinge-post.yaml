id: guard-hinge-post
kind: bolt-pattern
parties: [part://guard-shell, part://hinge-post]
name: Hinge post onto the guard
description: Four M6 bolts hold the hinge post to the guard's left wall, 140 mm apart up the wall.
frame: {origin: [0, 0, 0], normal: [-1, 0, 0]}
frames:
  # guard tray coordinates: y is the kiln's height; the post's leg centre line is hinge-post-y behind the lip plane
  part://guard-shell:
    origin: [{expr: "-guard-outer-width / 2", unit: mm}, 0, {expr: "guard-outer-depth - hinge-post-y - hinge-post-leg / 2", unit: mm}]
    normal: [-1, 0, 0]
    x_axis: [0, 1, 0]
  # post coordinates: leg against the wall at x ∈ [−t, 0], y along the depth from 0, z along the post
  part://hinge-post:
    origin: [{expr: "-hinge-post-thickness", unit: mm}, {expr: "hinge-post-leg / 2", unit: mm}, 0]
    normal: [-1, 0, 0]
    x_axis: [0, 0, 1]
# P2: the post's frame is on the leg's outer face, one angle thickness out from the guard
offset: param://hinge-post-thickness
spec: {pattern: line, count: 4, diameter: param://mount-bolt-clearance, spacing: [param://hinge-post-bolt-spacing], hardware: [{part: part://m6x16-bolt, per_hole: 1}, {part: part://m6-nut, per_hole: 1}], depth: 10 mm}
