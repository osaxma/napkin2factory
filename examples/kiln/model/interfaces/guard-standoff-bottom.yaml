id: guard-standoff-bottom
kind: bolt-pattern
parties: [part://outer-shell, part://guard-shell]
name: Shell to guard, bottom wall (the stand's bolts pass through)
description: Four M6 standoffs (25 mm) between the shell's bottom wall and the guard's bottom wall, on the stand bolt pattern so the lining load goes shell → standoff → guard → rail. Its holes are shell-frame-mount's, where one M6 × 50 bolt per corner runs from inside the shell through the standoff and the guard into the rail's rivet nut, so the bolt and the rivet nut are listed there and only the standoff here (DEC-021).
frame: {origin: [0, 0, 0], normal: [0, -1, 0]}
frames:
  part://outer-shell:
    origin: [0, {expr: "-shell-outer-height / 2", unit: mm}, {expr: "guard-outer-depth / 2 - guard-gap", unit: mm}]
    normal: [0, -1, 0]
    x_axis: [1, 0, 0]
  part://guard-shell:
    origin: [0, {expr: "-guard-outer-height / 2", unit: mm}, {expr: "guard-outer-depth / 2", unit: mm}]
    normal: [0, -1, 0]
    x_axis: [1, 0, 0]
# P2: the guard's wall sits one air gap and one guard sheet outside the shell's (M0 measured 26 mm)
offset: {expr: "guard-gap + guard-thickness", unit: mm}
spec: {pattern: rect, count: 4, diameter: param://mount-bolt-clearance, spacing: [param://mount-bolt-spacing-x, param://mount-bolt-spacing-y], hardware: [{part: part://m6-standoff-25, per_hole: 1}], depth: 20 mm}
