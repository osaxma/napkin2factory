id: guard-latch-keeper
kind: bolt-pattern
parties: [part://guard-shell, part://latch-keeper]
description: Two M6 bolts hold the latch keeper bracket to the guard's right wall.
frame: {origin: [0, 0, 0], normal: [1, 0, 0]}
frames:
  part://guard-shell:
    origin: [{expr: "guard-outer-width / 2", unit: mm}, 0, {expr: "guard-outer-depth - hinge-post-y - hinge-post-leg / 2", unit: mm}]
    normal: [1, 0, 0]
    x_axis: [0, 1, 0]
  part://latch-keeper:
    origin: [{expr: "hinge-post-thickness", unit: mm}, {expr: "hinge-post-leg / 2", unit: mm}, 0]
    normal: [1, 0, 0]
    x_axis: [0, 0, 1]
# P2: the keeper's frame is on the leg's outer face, one angle thickness out from the guard
offset: param://hinge-post-thickness
spec: {pattern: line, count: 2, diameter: param://mount-bolt-clearance, spacing: [30 mm], hardware: [{part: part://m6x16-bolt, per_hole: 1}, {part: part://m6-nut, per_hole: 1}], depth: 10 mm}
