children:
  - {part: part://outer-shell, qty: 1}
  - {part: part://guard-shell, qty: 1}
  - {part: part://stand, qty: 1}
  - {asm: asm://lining, qty: 1}
  - {part: part://hinge-post, qty: 1}
  - {part: part://latch-keeper, qty: 1}
  - {asm: asm://door, qty: 1}
  - {asm: asm://controls, qty: 1}
  - {part: part://thermocouple, qty: 2}
  - {part: part://door-switch, qty: 1, loose: true}
  - {part: part://m6-standoff-25, qty: 16}
  - {part: part://m6-standoff-40, qty: 4}
  - {part: part://m6x16-bolt, qty: 38}
  - {part: part://m6x50-bolt, qty: 4}
  - {part: part://m6-nut, qty: 6}
  - {part: part://m6-rivnut, qty: 4}
  - {part: part://earth-stud, qty: 3}
  - {part: part://kiln-shelf-set, qty: 1}
