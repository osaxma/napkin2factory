# Requirements: atomic, testable, each with a verify method and an allocation.
requirements:
  - id: REQ-001
    title: Firing volume
    statement: The chamber's gross interior volume is at least 8 liter (the usable volume is smaller; ware is kept 20 mm from the elements).
    category: performance
    priority: must
    verify: {kind: param_bound, target: param://chamber-volume, op: ">=", value: 8 liter}
    allocation: [param://chamber-width, param://chamber-depth, param://chamber-height, part://liner-side]
    rationale: A 200 mm cube holds a test-tile rack or a 150 mm pot. The 8 liter is the gross chamber; the 20 mm keep-clear zone in front of the element grooves makes the usable volume smaller, and the operation manual says so.
    source: intake
  - id: REQ-002
    title: Footprint
    statement: The complete kiln including the door and the controller box is at most 1000 mm wide.
    category: geometry
    priority: must
    verify: {kind: geometry_prop, target: "asm://kiln#props.bbox.x", op: "<=", value: 1000 mm}
    allocation: [asm://kiln, asm://door, part://guard-shell, part://controller-box]
    rationale: The owner described an alcove of about 800 mm; with the controller box beside the body and the door guard and hinges outside the guard the kiln needs about 1 m (DEC-011, flagged for the owner).
    source: intake
  - id: REQ-003
    title: Touchable surfaces stay cool
    statement: Every surface a user can touch during operation (body guard, door guard and latch) stays below 60 degC at steady state with the chamber at 1200 degC.
    category: safety
    safety: true
    priority: must
    verify: {kind: calc, target: calc://thermal.max_touch_temperature, op: "<", value: 60 degC}
    allocation: [part://guard-shell, part://door-guard, part://door-tray, param://fiber-thickness, param://guard-gap]
    rationale: Burn prevention. The inner shell and the door tray run hotter and sit behind two ventilated guards, one around the body and one in front of the door (DEC-003). calc://thermal.max_touch_temperature takes the hotter of the two guards and is supporting evidence only (DEC-015); the sign-off requires measuring the guard side wall, the guard top, the door guard and the latch with a contact thermometer once the kiln has held 1200 degC long enough to reach steady state.
    source: intake
  - id: REQ-004
    title: Mass
    statement: The complete kiln including the stand has a mass below 120 kg.
    category: mass
    priority: should
    verify: {kind: geometry_prop, target: "asm://kiln#props.mass", op: "<", value: 120 kg}
    allocation: [asm://kiln, param://fiber-thickness, param://brick-thickness]
    rationale: Delivered in parts; the body is lifted onto the stand by two people with the bricks and the door out (DEC-008).
    source: intake
  - id: REQ-005
    title: Cost target
    statement: The bill of materials totals less than 2500 USD at a quantity of 1.
    category: cost
    priority: should
    verify: {kind: bom_rollup, target: "bom://rollups#total_cost", op: "<", value: 2500 USD}
    allocation: [param://target-unit-cost, part://outer-shell, part://guard-shell, part://door-guard, part://stand, part://limit-controller]
    rationale: The intake said about 1500 USD; the safety parts added after review (limit controller, contactor, door switch, door guard) raise the estimate. the estimate is about 2200 USD; 2500 USD is pending the owner's confirmation (DEC-012).
    source: intake
  - id: REQ-006
    title: Element power within the circuit
    statement: The heating element draws at most 3000 W from a 230 V supply so that a dedicated 16 A circuit keeps a margin.
    category: performance
    priority: must
    verify: {kind: param_bound, target: param://element-power, op: "<=", value: 3000 W}
    allocation: [param://element-power, param://mains-voltage, param://circuit-rating, part://heating-element]
    rationale: The element is rated 2500 W (DEC-004), which draws 10.9 A on 230 V, 68 % of the 16 A circuit. 3000 W (13 A) is the ceiling. See DEC-006.
    source: design
  - id: REQ-007
    title: Controller away from the hot zone
    statement: The controller enclosure hangs on 40 mm standoffs outside the touch guard with its lid fitted, and its inside stays below 50 degC.
    category: safety
    safety: true
    priority: must
    verify: {kind: manual, note: "Check the box hangs on four 40 mm standoffs with the lid screwed on. After one hour with the chamber at 1200 degC, measure the air inside the box (probe through a gland, lid closed); it must read below 50 degC."}
    allocation: [part://controller-box, part://controller-lid, part://m6-standoff-40, param://controller-standoff, iface://controller-mount]
    rationale: Controllers and the solid-state relay derate above 50 degC and the relay needs air; the lid keeps fingers and dust off the mains terminals.
    source: design
  - id: REQ-008
    title: Dedicated circuit disclosed
    statement: The installation manual states that a dedicated 16 A circuit installed by a licensed electrician is required, and a rating label on the controller box says so.
    category: safety
    safety: true
    priority: must
    verify: {kind: manual, note: "Read the installation manual's power section and the rating label riveted to the controller box front; both name the dedicated 16 A circuit and the licensed electrician."}
    allocation: [doc://installation, part://controller-box, part://rating-label, param://circuit-rating]
    source: design
  - id: REQ-009
    title: Door latch and door switch
    statement: The door has a positive latch that holds it closed against a 50 N pull, and a door switch drops the contactor (cutting element power) whenever the door is not closed.
    category: safety
    safety: true
    priority: must
    verify: {kind: manual, note: "Pull the closed, latched door outward with 50 N (a luggage scale); it stays shut. With the controller calling for heat, open the door: the contactor must drop out (audible click, element voltage zero at the terminals, measured by the electrician) and stay out until the door is closed."}
    allocation: [part://latch, part://door-switch, part://contactor, asm://door, doc://operation]
    rationale: Opening a live kiln exposes the element and the hot chamber; the switch backs up the operating rule (switch off before opening). See DEC-010 and DEC-014.
    source: design
  - id: REQ-010
    title: Parts do not collide
    statement: No two parts of the assembly overlap in space.
    category: geometry
    priority: must
    verify: {kind: interference, target: asm://kiln}
    allocation: [asm://kiln]
    source: design
  - id: REQ-011
    title: Guard bolts to the stand
    statement: The guard's four mounting holes line up with the stand's holes within 0.5 mm.
    category: interface
    priority: must
    verify: {kind: interface, target: iface://shell-frame-mount}
    allocation: [part://guard-shell, part://stand, part://m6-rivnut, iface://shell-frame-mount]
    rationale: The guard carries the inner shell on its standoffs and bolts into rivet nuts in the stand's hollow top rails (DEC-009).
    source: design
  - id: REQ-012
    title: Hinge post holes agree
    statement: The hinge post's four bolt holes line up with the guard's left-wall holes within 0.5 mm.
    category: interface
    priority: must
    verify: {kind: interface, target: iface://guard-hinge-post}
    allocation: [part://guard-shell, part://hinge-post, part://hinge, iface://guard-hinge-post]
    rationale: The hinge post carries the door's weight and sets the hinge pin position that the swing calc assumes (DEC-013).
    source: design
  - id: REQ-013
    title: Two side liners
    statement: The assembly uses exactly 2 side liners.
    category: manufacturing
    priority: should
    verify: {kind: count, target: part://liner-side, op: "==", value: 2}
    allocation: [asm://kiln]
    source: design
  - id: REQ-014
    title: Door swing
    statement: The door opens to at least 100 degree so the chamber can be loaded from the front.
    category: usability
    priority: should
    verify: {kind: param_bound, target: param://door-swing, op: ">=", value: 100 degree}
    allocation: [asm://door, param://door-swing, part://hinge]
    source: intake
  - id: REQ-015
    title: Element wire fits the spool
    statement: The element needs less than 40 m of 1.6 mm Kanthal A1 wire.
    category: manufacturing
    priority: should
    verify: {kind: calc, target: calc://element.wire_length, op: "<", value: 40 m}
    allocation: [part://heating-element, param://element-power, param://element-wire-diameter]
    source: design
  - id: REQ-016
    title: Power margin over heat loss
    statement: The rated element power exceeds the steady loss plus the heat-up power by a margin of at least 20 percent (ratio 1.2).
    category: performance
    priority: must
    verify: {kind: calc, target: calc://element.power_margin, op: ">=", value: 1.2}
    allocation: [param://element-power, param://heat-up-time, param://fiber-thickness]
    rationale: Otherwise the kiln never reaches temperature or takes all day. The loss and stored heat come from the mean-area model (DEC-004, DEC-015).
    source: design
  - id: REQ-017
    title: Lead time
    statement: No part has a lead time above 30 d.
    category: manufacturing
    priority: should
    verify: {kind: bom_rollup, target: "bom://rollups#max_lead_time", op: "<=", value: 30 d}
    allocation: [part://outer-shell, part://guard-shell, part://stand]
    source: intake
  - id: REQ-018
    title: Independent over-temperature cut-out
    statement: An independent limit controller on its own thermocouple opens a contactor in series with the solid-state relay when the chamber exceeds 1250 degC, and power stays off until the limit controller is reset by hand.
    category: safety
    safety: true
    priority: must
    verify: {kind: manual, note: "With the electrician: set the limit controller's trip point temporarily below the chamber temperature during a low firing (or warm its thermocouple with a heat gun); the contactor must drop out, the element voltage must fall to zero, and power must stay off after the temperature falls until the reset key is pressed. Restore the trip point afterwards and record it."}
    allocation: [part://limit-controller, part://contactor, part://thermocouple, param://over-temperature-limit, doc://installation]
    rationale: A solid-state relay usually fails closed (on); the limit device and contactor stop a runaway firing before the K23 lining's 1260 degC class is exceeded (DEC-014).
    source: review gate 3
  - id: REQ-019
    title: Earth bonding
    statement: The inner shell, the guard, the door guard, the stand and the controller box are each bonded to protective earth with a resistance below 0.1 ohm to the earth terminal.
    category: safety
    safety: true
    priority: must
    verify: {kind: manual, note: "The electrician measures with a low-resistance ohmmeter from the earth terminal in the controller box to bare metal at each earth stud (inner shell, guard, door guard, stand, controller box); each reading is below 0.1 ohm."}
    allocation: [part://earth-stud, part://outer-shell, part://guard-shell, part://door-guard, part://stand, part://controller-box]
    rationale: The element runs on mains inside a steel case; a broken element touching the shell must trip the circuit protection instead of making the case live. Powder coat insulates, so each part gets its own stud on bare metal.
    source: review gate 3
  - id: REQ-020
    title: Door plug clears the opening
    statement: During the door swing the latch-side rear corner of the door plug clears the door opening by at least 3 mm.
    category: usability
    priority: must
    verify: {kind: calc, target: calc://swing.plug_clearance, op: ">=", value: 3 mm}
    allocation: [part://door-fiber, part://door-brick, part://hinge-post, param://door-plug-taper, param://door-plug-clearance, param://swing-clearance-min]
    rationale: The plug (fiber plus brick slab) is deep and swings about a pin outside the door guard; without the taper its rear corner would hit the fiber at the opening's latch side (DEC-013).
    source: review gate 3
  - id: REQ-021
    title: Element surface load
    statement: The element wire's surface load at rated power is at most 2.0 W/cm**2.
    category: performance
    priority: must
    verify: {kind: calc, target: calc://element.surface_load, op: "<=", value: 2.0 W/cm**2}
    allocation: [part://heating-element, param://element-wire-diameter, param://element-power, param://element-surface-load-limit]
    rationale: Above the limit for a grooved Kanthal A1 element at 1200 degC the wire runs too hot and its life drops sharply (DEC-005; limit from the Kanthal handbook, to be confirmed).
    source: review gate 3
  - id: REQ-022
    title: Coil pitch
    statement: The element coil, stretched along the grooves, has a pitch of at least 200 percent of the wire diameter (pitch factor 2).
    category: manufacturing
    priority: must
    verify: {kind: calc, target: calc://element.pitch_factor, op: ">=", value: 2}
    allocation: [part://heating-element, part://liner-side, part://liner-back, param://element-coil-diameter, param://element-grooves-per-wall, param://element-pitch-factor-min]
    rationale: Turns closer than two wire diameters shade each other and overheat; the five grooves per wall give the coil enough length to stretch (DEC-005).
    source: review gate 3
  - id: REQ-023
    title: Fits the alcove with the door open
    statement: The closed width plus the door swing of 703 mm stays within the 1750 mm alcove.
    category: geometry
    priority: must
    verify: {kind: geometry_prop, target: 'asm://kiln#props.bbox.x', op: <=, value: 1047 mm}
    allocation: ['asm://kiln']
    rationale: 'Door-swing term 703 mm (computed by screening: hinged-left: the 702 mm door leaf swung open
      beside the hinge); 1750 mm − 703 mm = 1047 mm for the closed width.'
    source: concept C-003 site constraint
  - id: REQ-024
    title: Runs on the site circuit
    statement: The element power is at most 3066.7 W, so the 230V-16A site circuit keeps a 1.2 headroom.
    category: performance
    priority: must
    verify: {kind: param_bound, target: 'param://element-power', op: <=, value: 3066.7 W}
    allocation: ['param://element-power', 'asm://kiln']
    rationale: '230 V × 16 A / 1.2: the same 1.2 headroom screening used (rule circuit-available); the NEC
      210.20 continuous-load factor 1.25 is stricter [verify].'
    source: concept C-003 site constraint
  - id: REQ-025
    title: Rounded exposed corners
    statement: Exposed bends and corners of the body, door, stand, controls and trim have a radius of at
      least 1 mm.
    category: geometry
    priority: must
    verify: {kind: rule, target: 'rule://form-v0/form-corner-radius'}
    allocation: ['asm://kiln']
    rationale: Chosen with C-003 (style corner_radius 1 mm); the threshold lives in style.yaml.
    source: concept C-003 style
  - id: REQ-026
    title: Controls where they were sketched
    statement: The controls sit side right on the product, as on C-003.
    category: usability
    priority: should
    verify: {kind: rule, target: 'rule://form-v0/form-controls-placement'}
    allocation: ['asm://kiln']
    rationale: Layout chosen with C-003 (layout.controls side-right); a misplaced control is a warning,
      never a failure.
    source: concept C-003 style
