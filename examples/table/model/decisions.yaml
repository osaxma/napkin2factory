  - id: DEC-002
    date: 2026-11-04
    title: Slotted fixings on the long rails, round holes on the short rails
    context: A solid oak top moves across its grain with the seasons (20.1 mm over its 800 mm width between 30 % and 70 % relative humidity); fixed rigidly along both long edges it would crack.
    decision: Fix the top to the frame with eight M8 inserts and screws on tabs welded to the rails. The six tabs on the long rails have a 9 x 22 mm slot across the width; the two on the short rails have a round 9 mm hole and sit on the top's centreline, which does not move across the grain.
    rationale: At a long-rail fixing, 280 mm from the centreline, the oak moves 7.05 mm against 13 mm of free travel in the slot (slot length less screw clearance), a margin of 45.8 %. The slotted fixings carry no shear, so the top and rails add their stiffness without composite action (the sag calc assumes this).
    links: [iface://top-fixing-long, iface://top-fixing-short, req://REQ-013, param://slot-length, part://top-board, part://apron-frame]
    made_by: agent
    disclosed: true
    verify: true
    sources: ["SPEC.md sections 3, 4.1 and 8; USDA Wood Handbook FPL-GTR-190 Ch. 4 (dimensional change coefficient 0.00365 per % for white oak, tangential)"]
  - id: DEC-003
    date: 2026-11-04
    title: Loads, limits and weld efficiency the spec chose
    context: The owner gave the centre load (150 kg), the edge load (50 kg), the 2.5 mm sag limit, 70 kg and 1600 USD. Nothing in the request fixes the lateral push, the sway limit, the sustained load or the weld efficiency.
    decision: Take a 300 N lateral push at top level, a 3.0 mm sway limit under 2.0 times it, a sustained load of 490.5 N (a vise and tools) plus self weight, and a weld efficiency of 0.7 for the fillet-welded thin-wall corners.
    rationale: These are the spec's own choices, each conservative or well inside its limit (sway 1.50 mm against 3.0 mm; corner factor 15.3 against 2.0). The factors of safety (yield 1.5, buckling 2.0, tip-over 2.0, pull-out 2.5, racking 2.0, deflection 1.0) are the calc kit's defaults per check and load kind.
    links: [param://lateral-push, param://sway-limit, param://sustained-load, param://weld-efficiency, req://REQ-010, req://REQ-011, req://REQ-006]
    made_by: agent
    disclosed: true
    verify: true
    sources: ["SPEC.md sections 1 and 4.0; ANSI/BIFMA X5.5 and EN 15372 horizontal-load clauses (to be checked); AISC 360-16; EN 1995-1-1 Table 3.2 (k_def 0.60)"]
  - id: DEC-004
    date: 2026-11-04
    title: Hardware and cost figures are estimates, costed at the high end
    context: The bought parts have no order code yet and the US cost bands (woodworking 9 to 22 USD/kg, welding 19.5 USD/kg) are estimates from 2026-10 and 2026-11.
    decision: Declare each custom part's cost at the high end of its band (top 28.8 kg x 22 USD/kg = 633.60 USD; frame 15.94 kg x 19.5 USD/kg = 310.75 USD) and the hardware at the spec's estimates (glide 0.080 kg and 4.00 USD; insert 0.010 kg and 1.50 USD; screw with washer 0.020 kg and 1.00 USD).
    rationale: The budget requirement is held against the high end of the band, so the total, 980.35 USD, is the worst case the owner should expect against 1600 USD (38.7 % to spare). The hardware masses are also parameters (glide-mass, insert-mass, screw-mass) the calcs read; they repeat the parts' mass fields.
    links: [req://REQ-014, req://REQ-001, part://top-board, part://apron-frame, part://leveling-foot, part://wood-insert-m8, part://mounting-bolt-m8]
    made_by: agent
    disclosed: true
    verify: true
    sources: ["SPEC.md section 4.0 (cost bands and hardware); calckit/data/cost_bands.yaml"]
