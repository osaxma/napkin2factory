  stretcher is drawn as a solid 24 x 36 mm bar of the same section area (864 mm2) because the
  rough shapes have no rectangular tube: the weight is the tube's. The 20 mm levelling glides, 40 mm in from the
  foot bars' ends, are drawn as 10 mm rods.
