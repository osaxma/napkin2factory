notes: |
  One welded frame of 50 x 50 x 1.5 mm tube, 1500 x 700 mm outside and inset 50 mm from every
  edge of the top; six slotted fixing tabs on the long rails, two round ones on the short rails
  (SPEC section 3). The 20 mm levelling glides are drawn as 10 mm rods
  under the legs so the table stands at its real height.
