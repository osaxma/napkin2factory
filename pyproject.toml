[project]
name = "napkin2factory"
version = "0.7.0"
description = "From napkin to factory: a text-only product model compiled into a manufacturable technical data package, with an engineering-change loop that rebuilds exactly what changed."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.15"
authors = [{ name = "osama" }]
keywords = ["cad", "build123d", "manufacturing", "bom", "engineering-change", "eco"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "build123d>=0.12,<0.13",
  "pint>=0.24",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",
  "typer>=0.15",
  "jinja2>=3.1",
  "ezdxf>=1.3",
  "openpyxl>=3.1",
  "typst>=0.13",
  "numpy>=2.0",
  "httpx>=0.27",
  "pygltflib>=1.16",
  "markdown-it-py>=3.0",
  "rich>=13.0",
  "packaging>=24.0",
  "pillow>=11.0",
]

[project.scripts]
n2f = "napkin2factory.cli.app:main"

[project.urls]
Homepage = "https://github.com/osaxma/napkin2factory"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.6",
  "ruff>=0.8",
  "mypy>=1.13",
  "hypothesis>=6.115",
  "lxml>=5.3",
  "selectolax>=0.3",
  "actionlint-py>=1.7",
  "twine>=6.0",
  "types-PyYAML",
  "types-openpyxl",
  "playwright>=1.48",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/napkin2factory"]

# The using-side docs ship inside the package; `docs/` stays the one source (S-231).
# The list is the topics of `n2f docs` (cli/docs.py); tests/unit/test_docs_verb.py keeps them equal.
[tool.hatch.build.targets.wheel.force-include]
"docs/agent-guide.md" = "napkin2factory/_docs/agent-guide.md"
"docs/calckit.md" = "napkin2factory/_docs/calckit.md"
"docs/checks.md" = "napkin2factory/_docs/checks.md"
"docs/cli.md" = "napkin2factory/_docs/cli.md"
"docs/domains.md" = "napkin2factory/_docs/domains.md"
"docs/ecr-loop.md" = "napkin2factory/_docs/ecr-loop.md"
"docs/electrical.md" = "napkin2factory/_docs/electrical.md"
"docs/how-it-works.md" = "napkin2factory/_docs/how-it-works.md"
"docs/kit.md" = "napkin2factory/_docs/kit.md"
"docs/napkin.md" = "napkin2factory/_docs/napkin.md"
"docs/product-model.md" = "napkin2factory/_docs/product-model.md"
"docs/render-checklist.md" = "napkin2factory/_docs/render-checklist.md"
"docs/schema-policy.md" = "napkin2factory/_docs/schema-policy.md"
"docs/vocabulary.md" = "napkin2factory/_docs/vocabulary.md"

[tool.hatch.build.targets.sdist]
# The docs are in the sdist too: `uv build` makes the wheel from the sdist (S-231).
include = ["src/napkin2factory", "README.md", "LICENSE", "pyproject.toml",
  "docs/agent-guide.md",
  "docs/calckit.md",
  "docs/checks.md",
  "docs/cli.md",
  "docs/domains.md",
  "docs/ecr-loop.md",
  "docs/electrical.md",
  "docs/how-it-works.md",
  "docs/kit.md",
  "docs/napkin.md",
  "docs/product-model.md",
  "docs/render-checklist.md",
  "docs/schema-policy.md",
  "docs/vocabulary.md"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["src/napkin2factory/report/vendor", "src/napkin2factory/templates", "examples/*/build", "docs/history", ".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "E722"]
ignore = ["D203", "D213", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E741"]
"src/napkin2factory/geometry/**" = ["E741"]   # `I` is the interface accessor by contract (D5)
"examples/*/model/geometry/**" = ["E741"]     # build rules take `(P, I, …)` (D5)

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["OCP", "OCP.*", "build123d", "build123d.*", "ezdxf", "ezdxf.*", "pygltflib", "pygltflib.*", "typst", "pint", "pint.*", "markdown_it", "markdown_it.*", "ruamel", "ruamel.*", "selectolax", "selectolax.*", "lxml", "lxml.*", "hypothesis", "hypothesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest's defaults plus the task folders (make task)
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", ".worktrees"]
addopts = "-q"
markers = [
  "timing: timing assertions (only under N2F_TIMING=1)",
  "full: kiln and demo end-to-end tests, run by make check-full (D27)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["napkin2factory.core"]
branch = false
