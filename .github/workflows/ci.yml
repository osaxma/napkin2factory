name: ci
on:
  push:
    branches: [main]   # the one trunk (S-097); tasks land on it locally, tags go to publish.yml
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly: make check-full with timing assertions
jobs:
  # A commit that already passed this workflow (for example a push of main that only added a
  # tag, or a re-run of the same tip) is not tested again: the gate looks for an earlier successful
  # run of the same commit and the check matrix is skipped when it finds one.
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.seen.outputs.skip }}
    steps:
      - id: seen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prior=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length')
          if [ "$prior" -gt 0 ]; then
            echo "::notice::${{ github.sha }} already passed ci ($prior earlier run(s)); not repeating the tests"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
  check:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run playwright install chromium
      - run: make check
  check-full:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      N2F_TIMING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run playwright install chromium
      - run: make check-full
