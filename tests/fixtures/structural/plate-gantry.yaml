# A made-up gantry: two thick steel side plates joined by a bridge at the top and one at the
# bottom, with four small block feet under it (the shape that crashed the structural screen,
# B-0235): it is not one column with one arm, and the screen must say so, not raise.
id: C-005
title: Plate gantry
site:
  point_load: 2000 N
  max_deflection: 0.2 mm
massing:
  - {kit: block, as: side-plate-left, material: mild steel, args: {length: 25 mm, width: 250 mm, height: 880 mm}, at: {x: -150 mm, z: 20 mm}}
  - {kit: block, as: side-plate-right, material: mild steel, args: {length: 25 mm, width: 250 mm, height: 880 mm}, at: {x: 150 mm, z: 20 mm}}
  - {kit: block, as: bottom-bridge, material: mild steel, args: {length: 275 mm, width: 40 mm, height: 60 mm}, at: {z: 20 mm}}
  - {kit: block, as: top-bridge, material: mild steel, args: {length: 275 mm, width: 40 mm, height: 60 mm}, at: {z: 840 mm}}
  - {kit: block, as: foot-1, material: mild steel, args: {length: 40 mm, width: 40 mm, height: 15 mm}, at: {x: -150 mm, y: -100 mm}}
  - {kit: block, as: foot-2, material: mild steel, args: {length: 40 mm, width: 40 mm, height: 15 mm}, at: {x: 150 mm, y: -100 mm}}
  - {kit: block, as: foot-3, material: mild steel, args: {length: 40 mm, width: 40 mm, height: 15 mm}, at: {x: -150 mm, y: 100 mm}}
  - {kit: block, as: foot-4, material: mild steel, args: {length: 40 mm, width: 40 mm, height: 15 mm}, at: {x: 150 mm, y: 100 mm}}
