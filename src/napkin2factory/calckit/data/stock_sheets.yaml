# Stock sheet sizes per material class (calckit.mass_cost.stock_sheet_fits). NOT
# VERIFIED: these are common stockist formats, not a standard; local suppliers differ.
# Every row is [verify] in DECISIONS.md. An unknown material class returns an `unknown`
# verdict; the caller warns.
