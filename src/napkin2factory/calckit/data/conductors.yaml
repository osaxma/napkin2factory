  - {id: cu-2p5-silicone, region: EU, label: "2.5 mm² silicone", csa: 2.5, ampacity: 17.4, ambient: 40, kind: high-temp,
     insulation: "silicone rubber, 180 °C (H05SJ-K / SiF class)", max_temp: 180,
