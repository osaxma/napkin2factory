# Copper conductors for wiring checks, by region (calckit.wiring; ELECTRICAL_STAGE E3).
# NOT VERIFIED by the project: every row is the owner's (or their electrician's) to confirm,
# and DECISIONS.md lists the table as [verify]. The values were written from the named tables
# by the project's agent without the standards at hand (2026-11-02): check each against the
# standard you hold before relying on it. Ampacity is the number a wiring check fails on, so
# every row names the exact table, column and installation basis it assumes.
# Columns: id, region, label, csa (mm2), awg (US rows), ampacity (A) at ambient (degC) on the
# stated basis, insulation, max_temp (degC, the insulation's conductor limit), kind
# (panel: wiring inside an enclosure or a machine; cord: a flexible supply cord; high-temp:
# insulation for hot zones).
# The silicone rows (EU) carry the PVC value as a floor, not their own rating: no silicone table
# was read. By IEC 60364-5-52 Table B.52.14's square-root rule, k = sqrt((theta_p - theta_a) /
# (theta_p - 30)), a 180 degC conductor at any ambient up to 150 degC keeps at least the
# temperature rise a 70 degC conductor has at 40 degC, so the floor errs low; the maker's table
# (DIN VDE 0298-4, heat-resistant cables) gives more and governs (S-146).
table: conductors
rows:
  # --- EU: PVC single cores (H05V-K / H07V-K class), 70 degC -------------------------------
  - {id: cu-0p75-pvc, region: EU, label: "0.75 mm² PVC", csa: 0.75, ampacity: 8.5, ambient: 40, kind: panel,
     insulation: "PVC, 70 °C (H05V-K class)", max_temp: 70,
     basis: "installation method B2 (cable in conduit or trunking on a wall), three loaded conductors",
     verify: true, source: "IEC 60204-1:2016 Table 6 (PVC-insulated copper, 70 °C conductor, +40 °C ambient), column B2, the lowest of B1/B2/C/E; the table is IEC 60364-5-52 Table B.52.4 x 0.87 (B.52.14 at 40 °C)"}
  - {id: cu-1p0-pvc, region: EU, label: "1.0 mm² PVC", csa: 1.0, ampacity: 10.1, ambient: 40, kind: panel,
     insulation: "PVC, 70 °C (H05V-K class)", max_temp: 70,
     basis: "installation method B2 (cable in conduit or trunking on a wall), three loaded conductors",
     verify: true, source: "IEC 60204-1:2016 Table 6 (PVC-insulated copper, 70 °C conductor, +40 °C ambient), column B2, the lowest of B1/B2/C/E"}
  - {id: cu-1p5-pvc, region: EU, label: "1.5 mm² PVC", csa: 1.5, ampacity: 13.1, ambient: 40, kind: panel,
     insulation: "PVC, 70 °C (H07V-K class)", max_temp: 70,
     basis: "installation method B2 (cable in conduit or trunking on a wall), three loaded conductors",
     verify: true, source: "IEC 60204-1:2016 Table 6, column B2 (= IEC 60364-5-52 Table B.52.4 method B2, 15 A at 30 °C, x 0.87 for 40 °C per Table B.52.14)"}
  - {id: cu-2p5-pvc, region: EU, label: "2.5 mm² PVC", csa: 2.5, ampacity: 17.4, ambient: 40, kind: panel,
     insulation: "PVC, 70 °C (H07V-K class)", max_temp: 70,
     basis: "installation method B2 (cable in conduit or trunking on a wall), three loaded conductors",
     verify: true, source: "IEC 60204-1:2016 Table 6, column B2 (= IEC 60364-5-52 Table B.52.4 method B2, 20 A at 30 °C, x 0.87 for 40 °C per Table B.52.14)"}
  - {id: cu-4p0-pvc, region: EU, label: "4 mm² PVC", csa: 4.0, ampacity: 23, ambient: 40, kind: panel,
     insulation: "PVC, 70 °C (H07V-K class)", max_temp: 70,
     basis: "installation method B2 (cable in conduit or trunking on a wall), three loaded conductors",
     verify: true, source: "IEC 60204-1:2016 Table 6, column B2 (= IEC 60364-5-52 Table B.52.4 method B2, 27 A at 30 °C, x 0.87 = 23.5 A for 40 °C, rounded down)"}
  # --- EU: silicone single cores (H05SJ-K / SiF class), 180 degC: PVC floor, see the header ---
  - {id: cu-0p75-silicone, region: EU, label: "0.75 mm² silicone", csa: 0.75, ampacity: 8.5, ambient: 40, kind: high-temp,
     insulation: "silicone rubber, 180 °C (H05SJ-K / SiF class)", max_temp: 180,
     basis: "the PVC row's value as a floor for ambients up to 150 °C (header); the maker's rating is higher",
     verify: true, source: "floor from IEC 60204-1:2016 Table 6 column B2 (cu-0p75-pvc) by IEC 60364-5-52 Table B.52.14's rule; replace with the maker's DIN VDE 0298-4 heat-resistant rating"}
  - {id: cu-1p0-silicone, region: EU, label: "1.0 mm² silicone", csa: 1.0, ampacity: 10.1, ambient: 40, kind: high-temp,
