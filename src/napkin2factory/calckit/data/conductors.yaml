  - {id: cu-4p0-silicone, region: EU, label: "4 mm² silicone", csa: 4.0, ampacity: 23, ambient: 40, kind: high-temp,
     insulation: "silicone rubber, 180 °C (H05SJ-K / SiF class)", max_temp: 180,
     basis: "the PVC row's value as a floor for ambients up to 150 °C (header); the maker's rating is higher",
     verify: true, source: "floor from IEC 60204-1:2016 Table 6 column B2 (cu-4p0-pvc) by IEC 60364-5-52 Table B.52.14's rule; replace with the maker's DIN VDE 0298-4 heat-resistant rating"}
  # --- US: machine-tool wire (MTW / THHN class, 90 degC insulation rated at the 60 degC column) ---
  - {id: awg18-mtw, region: US, label: "18 AWG MTW", awg: 18, csa: 0.823, ampacity: 7, ambient: 30, kind: panel,
     insulation: "MTW / THHN class, 90 °C dry (60 °C wet)", max_temp: 90,
