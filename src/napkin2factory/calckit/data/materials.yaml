# Wall, shell, structural and everyday manufacturing materials (W2).
# One row per material, read by concept screening (screening.py), massing densities
# (geometry/materials.py) and structural calcs (calckit/structural.py), so the napkin
# and the factory use the same numbers.
# NOT VERIFIED: every row is the owner's to confirm against the supplier's datasheet, and
# DECISIONS.md lists the table as [verify].
# Columns:
#   name: material display name.
#   keywords: lower-case words/aliases that select the row from a part's material name/spec.
#   conductivity: W/(m*K) at mean temperature (null: not used as thermal insulation).
#   density: kg/m3 nominal density.
#   specific_heat: J/(kg*K) (null: not used in thermal calcs).
#   process_class: default process class for cost bands.
#   youngs_modulus: Pa (N/m2) elastic modulus (null: printed plastics, refractories).
#   yield_strength: Pa (N/m2) yield strength (null: printed plastics, brittle materials).
#   moisture_basis: moisture content basis for wood properties (e.g. "12% MC").
#   verify: true until confirmed by a person against the supplier datasheet.
#   source: citation of standard, handbook or datasheet.
table: materials
rows:
  # --- Refractories (existing kiln materials) -------------------------------------------
  - name: K-23 insulating firebrick
    keywords: [brick, k23, k-23, firebrick]
    conductivity: 0.25
    density: 480
    specific_heat: 1000
    process_class: cut-block
    youngs_modulus: null
    yield_strength: null
    verify: true
    source: "Morgan Thermal Ceramics K-23 datasheet: k 0.20-0.30 W/m.K over 400-1000 degC, 0.25 taken at the ~700 degC mean of a 1200 degC hot face; bulk density 0.48 g/cm3; c 1.0-1.1 kJ/kg.K, 1000 taken"

  - name: ceramic fiber board (Kaowool 1260)
    keywords: [ceramic fiber, fiber board, fiber, fibre, kaowool, board, blanket]
    conductivity: 0.15
    density: 260
    specific_heat: 1050
    process_class: fiber-board
    youngs_modulus: null
    yield_strength: null
    verify: true
    source: "Morgan Thermal Ceramics Kaowool 1260 board datasheet: k 0.12-0.18 W/m.K over 400-700 degC mean; 0.15 taken because the board sits outside the brick at a ~400 degC mean (0.12 is the cool end and would understate the loss); nominal density 260 kg/m3; c 1.0-1.1 kJ/kg.K, 1050 taken"

