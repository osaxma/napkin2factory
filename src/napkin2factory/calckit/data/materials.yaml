# Wall and shell materials: one row per material, read by concept screening
# (concepts/screening.py, insulation layers) and by the massing densities
# (geometry/materials.py), so the napkin and the factory use the same numbers.
# NOT VERIFIED: every row is the owner's to confirm against the supplier's datasheet, and
# DECISIONS.md lists the table as [verify]. The calc kit itself holds no material constants
# (calckit/thermal_enclosure.py takes Layer objects).
# Columns: name; keywords (lower-case words that select the row from a layer or material
# name); conductivity W/(m*K) at the mean wall temperature (null: not used as insulation);
# density kg/m3; specific_heat J/(kg*K) (null: not used); process_class (cost band).
table: materials
rows:
  - name: K-23 insulating firebrick
    keywords: [brick, k23, k-23, firebrick]
    conductivity: 0.25
    density: 480
    specific_heat: 1000
    process_class: cut-block
    verify: true
    source: "Morgan Thermal Ceramics K-23 datasheet: k 0.20-0.30 W/m.K over 400-1000 degC, 0.25 taken at the ~700 degC mean of a 1200 degC hot face; bulk density 0.48 g/cm3; c 1.0-1.1 kJ/kg.K, 1000 taken (the kiln's brick-conductivity, brick-density, brick-specific-heat parameters)"
  - name: ceramic fiber board (Kaowool 1260)
    keywords: [ceramic fiber, fiber board, fiber, fibre, kaowool, board, blanket]
    conductivity: 0.15
    density: 260
    specific_heat: 1050
    process_class: fiber-board
    verify: true
    source: "Morgan Thermal Ceramics Kaowool 1260 board datasheet: k 0.12-0.18 W/m.K over 400-700 degC mean; 0.15 taken because the board sits outside the brick at a ~400 degC mean (the kiln's fiber-conductivity and DEC-002 range; 0.12 is the cool end and would understate the loss); nominal density 260 kg/m3; c 1.0-1.1 kJ/kg.K, 1050 taken"
  - name: mild steel
    keywords: [mild steel, steel]
    conductivity: null
    density: 7850
    specific_heat: null
    process_class: null
    verify: true
    source: "carbon steel 7.85 g/cm3 (engineering handbook value; EN 10130 DC01 / CR4 sheet)"
