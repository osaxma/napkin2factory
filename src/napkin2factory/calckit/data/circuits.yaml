# Supply circuit classes per region, for screening an element's current (calckit.power).
# NOT VERIFIED by the project: every row is the owner's (or their electrician's) to
# confirm, and DECISIONS.md lists the table as [verify]. A region missing here is not an
# error: circuit_class() returns `unknown_region` and the caller warns.
# Columns: region code, label, nominal voltage (V), rating (A), kind (plug | dedicated).
table: circuits
rows:
