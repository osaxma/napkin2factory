# Cost bands per process class and region (calckit.mass_cost.cost_estimate, cost_band; W3).
# NOT VERIFIED: every row is [verify] in DECISIONS.md until confirmed by real supplier quotes.
# Columns:
#   process_class: process class name.
#   unit: per_kg (mass), per_m (length, extrusions), per_m2 (area), per_item (count).
#   low: lower bound rate in currency per unit.
#   high: upper bound rate in currency per unit.
#   currency: currency code (USD, EUR).
#   region: supply region (US, EU).
#   as_of: quote / estimate date (YYYY-MM).
#   verify: true until confirmed by a person.
#   source: citation of quote or per-part estimate basis.
table: cost_bands
rows:
