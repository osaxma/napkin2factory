# Dimensional change coefficients for wood species across relative humidity changes.
# Dimensional change formula (USDA Wood Handbook, Ch. 13 & Ch. 4):
#   Delta_W = W_0 * C * Delta_M
# where C is tangential_coeff or radial_coeff per 1% change in moisture content below FSP (30%),
# and Delta_M is change in moisture content (percentage points) calculated from relative humidity.
# Every row is [verify] in DECISIONS.md.
table: wood_movement
rows:
  - species: white-oak
    tangential_coeff: 0.00365
    radial_coeff: 0.00180
    verify: true
    source: "USDA Forest Products Laboratory Wood Handbook (FPL-GTR-190, 2010), Chapter 4, Table 4-4: Dimensional change coefficients for domestic woods (Quercus alba)"

