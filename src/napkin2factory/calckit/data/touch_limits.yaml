# Burn thresholds for skin touching a hot surface (rule skin-vs-touch-limit, concept-v0).
# NOT VERIFIED: ISO 13732-1:2006 "Ergonomics of the thermal environment — Methods for the
# assessment of human responses to contact with surfaces — Part 1: Hot surfaces" gives the
# surface temperature at which a contact of a given length starts a burn; the long-contact
# figures below are quoted from it for metal (other materials are higher) and every row is
# [verify] against the standard's own table. They are thresholds, not design limits: a
# product's own touch limit (a value on its concept card, a requirement) takes precedence.
# Short accidental touches (about 1 to 10 s) tolerate more and depend on the material; they
# are not tabulated here.
table: touch_limits
rows:
  - {contact: 1 min, limit_degC: 51, words: "the 1-minute burn threshold for metal in ISO 13732-1, to be checked", verify: true,
     source: "ISO 13732-1:2006, burn threshold for a contact period of 1 min (metal)"}
  - {contact: 10 min, limit_degC: 48, words: "the 10-minute burn threshold for metal in ISO 13732-1, to be checked", verify: true,
     source: "ISO 13732-1:2006, burn threshold for a contact period of 10 min (metal)"}
  - {contact: 8 h, limit_degC: 43, words: "the 8-hour burn threshold in ISO 13732-1, to be checked", verify: true,
     source: "ISO 13732-1:2006, burn threshold for a contact period of 8 h and longer"}
