name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv tool install "napkin2factory>=0.3,<0.4"
      - run: n2f validate && n2f lint
      - run: n2f build
      - run: n2f check
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: build/report
